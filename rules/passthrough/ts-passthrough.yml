id: ts-passthrough
language: typescript
severity: info
message: pass-through function — body is one call with the parameters handed on
rule:
  any:
    - pattern: function $NAME($$$PARAMS) { return $CALLEE($$$ARGS) }
    - pattern: export function $NAME($$$PARAMS) { return $CALLEE($$$ARGS) }
    - pattern: export default function $NAME($$$PARAMS) { return $CALLEE($$$ARGS) }
    - pattern: async function $NAME($$$PARAMS) { return $CALLEE($$$ARGS) }
    - pattern: export async function $NAME($$$PARAMS) { return $CALLEE($$$ARGS) }
    - pattern: const $NAME = ($$$PARAMS) => $CALLEE($$$ARGS)
    - pattern: export const $NAME = ($$$PARAMS) => $CALLEE($$$ARGS)
    - pattern: const $NAME = async ($$$PARAMS) => $CALLEE($$$ARGS)
    - pattern: export const $NAME = async ($$$PARAMS) => $CALLEE($$$ARGS)
