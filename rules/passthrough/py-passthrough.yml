id: py-passthrough
language: python
severity: info
message: pass-through function — body is one call with the parameters handed on
rule:
  kind: function_definition
  has:
    field: body
    all:
      - has:
          kind: return_statement
          has:
            kind: call
      - not:
          has:
            any:
              - kind: if_statement
              - kind: for_statement
              - kind: while_statement
              - kind: try_statement
              - kind: with_statement
              - kind: assignment
              - kind: augmented_assignment
              - kind: expression_statement
                has:
                  kind: call
