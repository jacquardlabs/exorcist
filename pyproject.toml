[project]
name = "exorcist"
dynamic = ["version"]
description = "Aggressive simplification for LLM-generated code — concepts removed, not lines"
requires-python = ">=3.9"
dependencies = []

[tool.semantic_release]
# The version lives in the plugin manifest and is bumped by CI on merge to main —
# never edit it by hand. Conventional Commits drive the bump; a non-conforming PR
# title produces no release rather than an error.
version_variables = [".claude-plugin/plugin.json:version"]
tag_format = "v{version}"
# allow_zero_version keeps the first release at 0.x instead of normalising to 1.0.0;
# major_on_zero keeps a breaking change inside the 0.x line until the surface has
# earned a stable promise.
allow_zero_version = true
commit_message = "chore(release): v{version} [skip ci]"
major_on_zero = false
build_command = ""
upload_to_vcs_release = true

[tool.semantic_release.branches.main]
match = "main"

[tool.ruff]
# 3.9 is the floor, not the target: scripts/ runs on whatever `python3` the host has.
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "PERF", "PIE", "RUF", "SIM"]
